[project]
name = "perturb-seq-pilot"
version = "0.2.0"
description = "Environment for analysis of DepMap's Perturb-seq pilot"
authors = [
    {name = "Samuel Maffa",email = "smaffa@broadinstitute.org"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas (>=1.5.3,<2.0.0)",
    "numpy (>=1.26,<2.0.0)",
    "scipy (>=1.14.1,<1.15.0)",
    "scikit-learn (>=1.5.2,<1.5.3)",
    "umap-learn (>=0.5.6,<0.5.7)",
    "matplotlib (>=3.9.2,<3.9.3)",
    "seaborn (>=0.13.2,<0.13.3)",
    "upsetplot (>=0.9.0,<0.9.1)",
    "adjusttext (>=1.2.0,<1.2.1)",
    "tqdm (>=4.66.5,<4.66.6)",
    "lxml (>=5.3.0,<5.3.1)",
    "gseapy (>=1.1.3,<1.1.4)",
    "taigapy @ git+https://github.com/broadinstitute/taigapy.git@f8327ef88a154cec9eddcf36decc92688419061f",
    "jupyter (>=1.1.1,<1.1.2)",
    "ipykernel (>=6.29.5,<6.29.6)",
    "statsmodels (>=0.14.4,<0.14.5)",
    "networkx (>=3.4.2,<3.4.3)",
    "igraph (>=0.11.8,<0.11.9)",
    "scanpy (>=1.11.2,<2.0.0)",
    "pybedtools (>=0.12.0,<0.13.0)",
]


[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"